<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: required before env(safe-area-inset-*) reports
         anything but 0, which is what keeps the fragment and the input off a
         notch and off the home indicator (TOUCH_PWA.md §3). user-scalable=no is
         for Android only — iOS Safari ignores it, so the real defences are the
         touch-action / overscroll-behavior rules below. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="WORDBOMB — everyone gets the same fragment, a hidden fuse burns, every answer is revealed at once."
    />
    <title>WORDBOMB</title>
    <!-- PWA install (TOUCH_PWA.md §1). The manifest and icons are generated by
         scripts/gen-pwa-assets.mjs into public/, which vite copies to the dist
         root; the platform serves that dist at /wordbomb/, so vite rewrites
         these root-relative hrefs to /wordbomb/… in dev and in the built
         output alike. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest when deciding install shape: without these an
         iPad install opens inside Safari chrome and the exercise fails
         (TOUCH_PWA.md §1.3). Status bar 'black' rather than 'black-translucent'
         because WORDBOMB is a text layout with an on-screen keyboard — an
         opaque bar reserves its own space instead of floating over the
         fragment. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="WORDBOMB" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Pre-boot paint guard only; the real stylesheet is src/style.css.
         The colour below MUST stay equal to `:root { --ink }` / WPAL.ink
         (#0d1014) in src/style.css, or the pre-boot flash diverges from the app.
         No external assets and no external fonts anywhere in this game. -->
    <style>
      html,
      body {
        margin: 0;
        background: #0d1014;
        color-scheme: dark;
      }
    </style>
    <!-- Touch safety (TOUCH_PWA.md §3). iOS Safari IGNORES user-scalable=no, so
         THESE rules — not the viewport meta — are what actually stop a stray
         thumb zooming, bouncing or refreshing the page while the fuse burns:
           · touch-action: pan-x pan-y on the page kills double-tap zoom and
             pinch zoom while leaving ordinary scrolling alive (the answer list
             must still scroll on a tablet);
           · touch-action: none on any canvas — a drag on a play surface must
             never move the page;
           · overscroll-behavior: none kills pull-to-refresh and the iOS
             rubber-band, the two gestures that yank a player out of a round.
         The --safe-* properties expose the notch / home-indicator insets that
         viewport-fit=cover above makes non-zero, for src/style.css to consume.
         Declared before the app stylesheet so the game can always override. -->
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      html,
      body {
        touch-action: pan-x pan-y;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        touch-action: none;
      }
    </style>
    <link rel="stylesheet" href="/src/style.css" />
    <!-- Service worker (TOUCH_PWA.md §2.0 — the path is frozen; T2 owns the
         worker itself). Guarded three ways so this page can never break on
         account of it: production only (vite dev plus a caching worker is a
         debugging nightmare, §2.1), only where the API exists, and only when
         the URL really serves JavaScript. The platform answers a missing file
         with its SPA fallback (index.html as text/html, status 200), so the
         content-type check — not the status — is what tells "worker not
         shipped yet" from "worker is there", and a probe that lands on the
         fallback is a silent no-op: no 404, no console noise, where
         registering blind would log a hard MIME-type error on every load until
         the worker ships. The probe is a GET, deliberately, NOT a HEAD:
         Chromium reports a HEAD to this server as net::ERR_ABORTED the instant
         after its 200, and scripts/e2e.mjs counts a failed request as a page
         error. The worker is a couple of kB, so a GET costs nothing. -->
    <script type="module">
      const env = import.meta.env;
      if (env && env.PROD && 'serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          fetch('/wordbomb/sw.js', { cache: 'no-store' })
            .then((res) => {
              const type = res.headers.get('content-type') || '';
              if (!res.ok || !/javascript|ecmascript/i.test(type)) return undefined;
              return navigator.serviceWorker.register('/wordbomb/sw.js', { scope: '/wordbomb/' });
            })
            .catch(() => {});
        });
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
