<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="ANCIENTS — a mini MOBA. Push lanes, raze towers, break the enemy Ancient."
    />
    <title>ANCIENTS</title>
    <!-- PWA install (TOUCH_PWA.md §1). The manifest and icons are generated by
         scripts/gen-pwa-assets.mjs into public/, which vite copies to the dist
         root; the platform serves that dist at /rift/, so these paths hold in
         dev and in the built output alike. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest for install shape: without these three tags an
         iPad install opens inside Safari chrome and the whole exercise fails
         (TOUCH_PWA.md §1.3). black-translucent gives the map the full screen;
         the status bar then floats over the canvas, which is why the HUD
         respects the safe-area insets declared below. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ANCIENTS" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Pre-boot paint guard only; the real stylesheet is src/style.css.
         The colour below MUST stay equal to `:root { --ink }` / APAL.ink
         (#0e1116) in src/style.css, or the pre-boot flash diverges from the app.
         No external assets and no external fonts anywhere in this game. -->
    <style>
      html,
      body {
        margin: 0;
        background: #0e1116;
        color-scheme: dark;
      }
    </style>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      html,
      body {
        touch-action: pan-x pan-y;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        touch-action: none;
      }
    </style>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
