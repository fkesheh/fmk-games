<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: required before env(safe-area-inset-*) reports
         anything but 0, which is what keeps the touch controls off the home
         indicator (TOUCH_PWA.md §3). user-scalable=no is for Android only —
         iOS Safari ignores it, so the real defences are touch-action and
         overscroll-behavior in src/style.css. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>SKI SPLAT</title>
    <meta name="color-scheme" content="dark" />
    <!-- PWA install (TOUCH_PWA.md §1). The manifest and icons are generated by
         scripts/gen-pwa-assets.mjs into public/, which vite copies to the dist
         root; the platform serves that dist at /splat/, so these paths hold in
         dev and in the built output alike. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SKI SPLAT" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Pre-boot paint guard only; the real stylesheet is src/style.css.
         The background MUST stay byte-equal to `:root`'s page colour in
         style.css — that is SPAL.ink, #10141c — or the pre-boot flash diverges
         from the app. This inline hex and the `:root` mirror in style.css are
         the only hex literals permitted outside the palette file.
         No external assets/fonts. -->
    <style>
      html,
      body {
        margin: 0;
        background: #10141c;
        color-scheme: dark;
      }
    </style>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/ui/hud.css" />
    <!-- Service worker probe (TOUCH_PWA.md §2.0). Guarded: production only,
         API exists, and the URL really serves JavaScript (the platform's SPA
         fallback answers index.html as text/html — the content-type check is
         what tells "not shipped yet" from "worker is there"). GET, not HEAD:
         Chromium reports HEAD to this server as ERR_ABORTED and the e2e counts
         failed requests as page errors. -->
    <script type="module">
      const env = import.meta.env;
      if (env && env.PROD && 'serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          fetch('/splat/sw.js', { cache: 'no-store' })
            .then((res) => {
              const type = res.headers.get('content-type') || '';
              if (!res.ok || !/javascript|ecmascript/i.test(type)) return undefined;
              return navigator.serviceWorker.register('/splat/sw.js', { scope: '/splat/' });
            })
            .catch(() => {});
        });
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
