<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: required before env(safe-area-inset-*) reports
         anything but 0, which is what keeps HUD furniture off a notch and off
         the home indicator (TOUCH_PWA.md §3). user-scalable=no is for Android
         only — iOS Safari ignores it, so the real defences are the
         touch-action / overscroll-behavior rules below. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>STRICKEN</title>
    <!-- PWA install (TOUCH_PWA.md §1). The manifest and icons are generated by
         scripts/gen-pwa-assets.mjs into public/, which vite copies to the dist
         root; the platform serves that dist at /fps/, so vite rewrites these
         root-relative hrefs to /fps/… in dev and in the built output alike. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest when deciding install shape: without these an
         iPad install opens inside Safari chrome and the exercise fails
         (TOUCH_PWA.md §1.3). Status bar 'black' rather than 'black-translucent'
         because STRICKEN's HUD is not inset-aware — an opaque bar reserves its
         own space instead of floating over the crosshair. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="STRICKEN" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Pre-boot paint guard only; the real stylesheet is src/style.css.
         The ONE colour literal in this client: it MUST stay equal to PALETTE.ink
         (shared/src/palette.ts) and to the :root page background style.css paints
         from --c11-ink, or the pre-boot flash diverges from the app
         (VISUAL_UPGRADE.md seam rule 6). `color-scheme: dark` gives the boot
         splash a light UA default text colour before the stylesheet lands, with
         no second colour literal. No external assets/fonts. -->
    <style>
      html {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14171c; /* PALETTE.ink */
      }
    </style>
    <!-- Touch safety (TOUCH_PWA.md §3). iOS Safari IGNORES user-scalable=no, so
         THESE rules — not the viewport meta — are what actually stop a stray
         thumb zooming, bouncing or refreshing the page mid-round:
           · touch-action: pan-x pan-y on the page kills double-tap zoom and
             pinch zoom while leaving ordinary scrolling alive (menus and the
             scoreboard must still scroll on a tablet);
           · touch-action: none on the canvas — a drag across the play surface
             must never move the page;
           · overscroll-behavior: none kills pull-to-refresh and the iOS
             rubber-band, the two gestures that yank a player out of a match.
         The --safe-* properties expose the notch / home-indicator insets that
         viewport-fit=cover above makes non-zero, for src/style.css to consume.
         Declared before the app stylesheet so the game can always override. -->
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      html,
      body {
        touch-action: pan-x pan-y;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        touch-action: none;
      }
    </style>
    <!-- Service worker (TOUCH_PWA.md §2.0 — the path is frozen; T2 owns the
         worker itself). Guarded three ways so this page can never break on
         account of it: production only (vite dev plus a caching worker is a
         debugging nightmare, §2.1), only where the API exists, and only when
         the URL really serves JavaScript. The platform answers a missing file
         with its SPA fallback (index.html as text/html, status 200), so the
         content-type check — not the status — is what tells "worker not
         shipped yet" from "worker is there", and a probe that lands on the
         fallback is a silent no-op: no 404, no console noise, where
         registering blind would log a hard MIME-type error on every load until
         the worker ships. The probe is a GET, deliberately, NOT a HEAD:
         Chromium reports a HEAD to this server as net::ERR_ABORTED the instant
         after its 200, and scripts/e2e.mjs counts a failed request as a page
         error. The worker is a couple of kB, so a GET costs nothing. -->
    <script type="module">
      const env = import.meta.env;
      if (env && env.PROD && 'serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          fetch('/fps/sw.js', { cache: 'no-store' })
            .then((res) => {
              const type = res.headers.get('content-type') || '';
              if (!res.ok || !/javascript|ecmascript/i.test(type)) return undefined;
              return navigator.serviceWorker.register('/fps/sw.js', { scope: '/fps/' });
            })
            .catch(() => {});
        });
      }
    </script>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="hud"></div>
      <div id="menu"></div>
      <!-- Loading state; removed by main.ts once boot() completes (or at once
           on a fatal error, so failures are never hidden behind a spinner). -->
      <div id="boot" class="boot-splash" role="status" aria-live="polite">
        <div class="boot-mark">STRICKEN</div>
        <div class="boot-bar"><span class="boot-bar-fill"></span></div>
        <div class="boot-note">Loading</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
