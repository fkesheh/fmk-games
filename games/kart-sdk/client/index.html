<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: required before env(safe-area-inset-*) reports
         anything but 0, which is what keeps the touch controls off the home
         indicator (TOUCH_PWA.md §3). user-scalable=no is for Android only —
         iOS Safari ignores it, so the real defences are touch-action and
         overscroll-behavior in src/style.css. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>KART GP</title>
    <meta name="color-scheme" content="dark" />
    <!-- PWA install (TOUCH_PWA.md §1). The manifest and icons are generated by
         scripts/gen-pwa-assets.mjs into public/, which vite copies to the dist
         root; the platform serves that dist at /kart/, so these paths hold in
         dev and in the built output alike. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest for install shape: without these three tags an
         iPad install opens inside Safari chrome and the whole exercise fails
         (TOUCH_PWA.md §1.3). black-translucent gives the race the full screen;
         the status bar then floats over the canvas, which is why the controls
         respect the safe-area insets. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KART GP" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Pre-boot paint guard only; the real stylesheet is src/style.css.
         The background MUST stay byte-equal to `:root`'s page colour in
         style.css (VISUAL_UPGRADE.md §7 seam rule 6) — that is KPAL.ink,
         #14171c — or the pre-boot flash diverges from the app. This inline
         hex and the `:root` mirror in style.css are the only hex literals
         permitted outside the palette file. No external assets/fonts. -->
    <style>
      html,
      body {
        margin: 0;
        background: #14171c;
        color-scheme: dark;
      }
    </style>
    <link rel="stylesheet" href="/src/style.css" />
    <!-- Service worker (TOUCH_PWA.md §2.0 — the path is frozen; T2 owns the
         worker itself). Guarded three ways so this page can never break on
         account of it:
           1. production only — vite dev plus a caching worker is a debugging
              nightmare (§2.1);
           2. only where the API exists;
           3. only when the URL really serves JavaScript. The platform answers
              a missing file with its SPA fallback (index.html as text/html,
              status 200), so the content-type check — not the status — is what
              tells "worker not shipped yet" from "worker is there". A probe
              that lands on the fallback is a silent no-op — no 404, no console
              noise — whereas registering blind would log a hard MIME-type
              error on every load until the worker ships.
         The probe is a GET, deliberately, NOT a HEAD: Chromium reports a HEAD
         to this server as net::ERR_ABORTED the instant after its 200, and
         scripts/e2e.mjs counts a failed request as a page error. The worker is
         a couple of kB, so a GET costs nothing.
         Registering /kart/sw.js from inside /kart/ is also the only way to get
         a worker scoped to this game (a worker cannot claim a scope above its
         own path). -->
    <script type="module">
      const env = import.meta.env;
      if (env && env.PROD && 'serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          fetch('/kart/sw.js', { cache: 'no-store' })
            .then((res) => {
              const type = res.headers.get('content-type') || '';
              if (!res.ok || !/javascript|ecmascript/i.test(type)) return undefined;
              return navigator.serviceWorker.register('/kart/sw.js', { scope: '/kart/' });
            })
            .catch(() => {});
        });
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
