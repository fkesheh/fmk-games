app = "stricken-fps"
primary_region = "iad"

[build]
  dockerfile = "deploy/Dockerfile"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # WebSocket upgrades (/ws) ride the standard http/tls handlers.
  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    method = "GET"
    path = "/"
    protocol = "http"
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = 512
